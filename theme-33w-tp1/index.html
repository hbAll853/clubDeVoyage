<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Club de voyage</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="entete">
    <div class="entete__contenu">
      <img src="images/logo.png" alt="Logo Club" class="entete__logo" />
      <nav class="entete__nav">
        <ul class="entete__menu">
          <li class="entete__menu-item"><a href="#">Aventure</a></li>
          <li class="entete__menu-item"><a href="#">Culturel</a></li>
          <li class="entete__menu-item"><a href="#">Zen</a></li>
          <li class="entete__menu-item"><a href="#">Sport</a></li>
          <li class="entete__menu-item"><a href="#">Croisière</a></li>
          <li class="entete__menu-item"><a href="#">Repos</a></li>
          <li class="entete__menu-item"><a href="#">Paysage</a></li>
          <li class="entete__menu-item"><a href="#">Pleine nature</a></li>
        </ul>
      </nav>
      <form class="recherche">
        <input class="recherche__input" type="search" placeholder="Rechercher une destination">
        <button class="recherche__bouton" type="submit">🔍</button>
      </form>      
    </div>
  </header>

  <section class="hero">
    <div class="hero__contenu">
      <h1 class="hero__titre">Voyagez vers des lieux uniques</h1>
      <p class="hero__texte">Des aventures exclusives pour les membres du club.</p>
    </div>
  </section>

  <section class="galerie">
    <h2 class="galerie__titre">Destinations</h2>
    <div class="galerie__grille">
      <img src="images/acores.jpg" alt="Açores" class="galerie__image" />
      <img src="images/maldives.jpg" alt="Maldives" class="galerie__image" />
    </div>
  </section>

  <section class="populaire">
    <h2 class="populaire__titre">Offres populaires</h2>
    <p class="populaire__texte">Bénéficiez d’offres réservées aux membres.</p>
  </section>

  <footer class="pieddepage">
    <p class="pieddepage__texte">&copy; 2025 Club de voyage</p>
  </footer>
</body>
</html>
